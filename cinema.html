<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Захария — кино на странице</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07060c; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, #000a 100%); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 14px; padding-bottom: 9vh; z-index: 5;
    background: linear-gradient(to top, #000c, transparent 55%); text-align: center; }
  #start h1 { margin: 0; font-size: 26px; letter-spacing: .02em; text-shadow: 0 2px 16px #000; }
  #start p { margin: 0; opacity: .8; font-size: 14px; }
  button { font: inherit; font-size: 19px; font-weight: 700; padding: 15px 34px; border: 0; border-radius: 999px; background: #ffd75e; color: #3a2410; box-shadow: 0 6px 24px #0008; }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; width: 0; background: #ffd75e; z-index: 4; transition: width .25s linear; }
  #title { position: fixed; left: 0; right: 0; top: 5vh; text-align: center; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; opacity: 0; transition: opacity 2s; text-shadow: 0 2px 12px #000; z-index: 3; pointer-events: none; }
  #title.on { opacity: .85; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="title">Благовестие Захарии о рождении Иоанна</div>
<div id="bar"></div>
<div id="start"><h1>Захария и ангел</h1><p>Включи звук · наклоняй телефон или двигай мышью</p><button id="go">▶ Смотреть</button></div>
<script type="module" src="/src/cinema.js"></script>
</body>
</html>
