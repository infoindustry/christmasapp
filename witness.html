<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14102a">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Рождество">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Свидетель</title>
<link rel="stylesheet" href="/src/witness/style.css">
<script>
  // start downloading the big files right away, in parallel with the page script (the model, the medallion texture, the first words)
  (function () {
    var id = new URLSearchParams(location.search).get('id') || 'zechariah', h = document.head, add = function (href, as, type) { var l = document.createElement('link'); l.rel = 'preload'; l.href = href; l.as = as; if (type) l.type = type; if (as === 'fetch') l.crossOrigin = ''; h.appendChild(l); };
    if (id === 'bethlehem') { add('bethlehem/bethlehem.glb', 'fetch'); add('family/family.glb', 'fetch'); } if (id !== 'word' && id !== 'room' && id !== 'bethlehem' && id !== 'game' && id !== 'quiz') add('witnesses/' + id + '/model.glb', 'fetch'); if (id === 'room') add('room/room.glb', 'fetch');
    if (id !== 'game' && id !== 'quiz' && id !== 'bethlehem') add('medallions/' + id + '.webp', 'image'); if (id === 'game' || id === 'quiz') add('game/gingerbread.glb', 'fetch'); add('data/witnesses.json', 'fetch'); add('data/witnesses-audio.json', 'fetch');
  })();
</script>
</head>
<body class="stage">
<video id="cam" playsinline muted autoplay hidden></video>
<canvas id="c"></canvas>
<div id="loadbar"></div>
<a id="back" href="./">‹ Все свидетели</a>
<div id="head"><h1 id="name"></h1><small id="ref"></small></div>
<div id="modes" role="tablist"><button data-mode="scene" class="on">Сцена</button><button data-mode="marker" hidden>AR · Звезда</button><button data-mode="marker2" hidden>AR · Свеча</button><button data-mode="xr8" hidden>AR · Вифлеем</button><button data-mode="surface" hidden>AR · стол</button></div>
<div id="arhint" hidden></div>
<div id="panel">
  <div id="dots"></div>
  <div id="sub"></div>
  <div id="controls">
    <button id="btnStory" class="primary">▶ Рассказать</button>
    <button id="btnPause" hidden>⏸</button>
    <button id="btnNext" hidden>⏭</button>
    <button id="btnAsk">Спросить</button>
    <button id="btnCC" aria-label="Субтитры">Aa</button>
  </div>
  <div id="questions" hidden></div>
</div>
<div id="start"><a id="sback" href="./">‹ Назад</a><div class="sbg"></div>
  <main class="sheet">
    <header class="shead"><img id="startImg" alt=""><div class="stitle"><h2 id="startName"></h2><span id="startRef" class="chip"></span></div></header>
    <section class="sec"><h3 id="startQ">Как будем смотреть?</h3><div id="opts"></div></section>
    <section class="sec how"><h3>Как это работает</h3><ol id="how"></ol><p id="tip"></p></section>
  </main>
  <footer class="sfoot"><button id="go" class="primary">Поехали!</button></footer>
</div>
<script type="module" src="/src/witness/main.js"></script>
</body></html>
