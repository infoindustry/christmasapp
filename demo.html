<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Захария и ангел — демо</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0a12; font-family: system-ui, sans-serif; color: #fff; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #page { position: relative; height: 100vh; height: 100dvh; max-width: 100vw; aspect-ratio: 1200 / 1801; background: #000 center / cover no-repeat; overflow: hidden; box-shadow: 0 0 60px #000a; }
  #page video { position: absolute; display: block; object-fit: cover; opacity: 0; transition: opacity .7s ease; pointer-events: none; }
  #page video.on { opacity: 1; }
  #angel { cursor: pointer; pointer-events: auto !important;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent); mask-composite: intersect; }
  #go { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); font: inherit; font-size: 20px; font-weight: 700; padding: 16px 34px; border: 0; border-radius: 999px; background: #ffd75e; color: #3a2410; box-shadow: 0 6px 24px #0008; }
  #hint { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); background: #000a; padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .5s; white-space: nowrap; }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="page">
    <video id="scene" muted loop playsinline preload="auto"></video>
    <video id="angel" playsinline preload="auto"></video>
    <button id="go">✨ Оживить страницу</button>
    <div id="hint">Коснись ангела — он повторит</div>
  </div>
</div>
<script type="module">
  const BASE = '/scenes/zakhariya/';
  const cfg = await fetch(BASE + 'scene.json').then(r => r.json());
  const page = document.getElementById('page'), scene = document.getElementById('scene'), angel = document.getElementById('angel');
  page.style.backgroundImage = `url(${BASE}page.jpg)`;
  const [sc, an] = cfg.layers;
  const place = (el, [x, y, w, h]) => Object.assign(el.style, { left: x / cfg.page.w * 100 + '%', top: y / cfg.page.h * 100 + '%', width: w / cfg.page.w * 100 + '%', height: h / cfg.page.h * 100 + '%' });
  place(scene, sc.rect); place(angel, an.rect);
  scene.src = BASE + sc.video; angel.src = BASE + an.video;
  const choir = Object.assign(new Audio(BASE + cfg.audio), { loop: true, volume: cfg.audioVolume ?? 0.3 });
  const hint = document.getElementById('hint');
  let timer, running = false;
  const sayAngel = () => { clearTimeout(timer); angel.currentTime = 0; angel.classList.add('on'); angel.play().catch(() => {}); hint.classList.remove('on'); };
  angel.addEventListener('ended', () => { angel.classList.remove('on'); hint.classList.add('on'); });
  angel.addEventListener('click', sayAngel);
  document.getElementById('go').addEventListener('click', e => {
    e.target.remove();
    running = true; scene.classList.add('on'); scene.play(); choir.play().catch(() => {});
    setInterval(() => { if (running && scene.paused) scene.play().catch(() => {}); }, 400);   // keep the background alive
    timer = setTimeout(sayAngel, (an.delay ?? 1.8) * 1000);
  });
</script>
</body>
</html>
