<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ваши модели</title>
<style>html,body{margin:0;background:#15122a;color:#fff;font-family:system-ui,sans-serif}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:10px}
.cell{height:300px;border-radius:12px;background:#221d3d;position:relative}.cell span{position:absolute;left:10px;bottom:8px;font-size:13px;opacity:.9;text-shadow:0 1px 4px #000}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}</style></head>
<body><div id="grid"></div><canvas id="c"></canvas><script type="module" src="/src/gallery.js"></script></body></html>
