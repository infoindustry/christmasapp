<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ночь пастуха</title>
<style>html,body{margin:0;height:100%;background:#04050f;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#fff}canvas{position:fixed;inset:0;width:100%;height:100%}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 50%,transparent 58%,#000a 100%)}
#sub{position:fixed;left:0;right:0;bottom:9vh;text-align:center;font-size:clamp(17px,2.4vw,26px);letter-spacing:.02em;text-shadow:0 2px 14px #000;z-index:4;opacity:0;transition:opacity 1.2s;padding:0 8vw;line-height:1.35;pointer-events:none}
#sub.on{opacity:1}#title{position:fixed;left:0;right:0;top:36vh;text-align:center;z-index:4;font-size:clamp(34px,6vw,72px);letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity 2.2s;text-shadow:0 4px 30px #000;pointer-events:none}#title.on{opacity:1}
#start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 40%,#23286a99,#04050fee 70%);text-align:center;padding:24px}
#start h1{margin:0;font-size:34px;letter-spacing:.05em}#start p{margin:0;opacity:.8;max-width:340px;line-height:1.4;font-family:system-ui,sans-serif;font-size:15px}
button{font:inherit;font-family:system-ui,sans-serif;font-size:19px;font-weight:700;padding:15px 36px;border:0;border-radius:999px;background:#ffd75e;color:#3a2410}
#again{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:5;display:none}#load{position:fixed;left:0;top:0;height:3px;background:#ffd75e;width:0;z-index:10;transition:width .3s}</style></head>
<body><canvas id="c"></canvas><div id="vig"></div><div id="fade"></div><div id="sub"></div><div id="title">Пастухи</div><div id="load"></div>
<button id="again">↺ Ещё раз</button>
<div id="start"><h1>Ночь пастуха</h1><p>Короткий фильм. Включи звук.</p><button id="go">▶ Смотреть</button></div>
<script type="module" src="/src/shepherd.js"></script></body></html>
