<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Портал в Вифлеем</title>

<body>
<video id="cam" playsinline muted autoplay></video>

</div>
<div id="start"><div class="box">

  <p id="lead">Открой в комнате дверь в ночь над Вифлеемом и шагни внутрь.</p>
  <button id="go" class="primary">🌟 Открыть портал</button>
  <p class="small" id="note"></p>
  <a href="./" class="home">‹ На главную</a>
</div></div>
<script type="module" src="/src/portal/main.js"></script>
